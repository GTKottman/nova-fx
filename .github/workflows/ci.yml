name: core

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - run: sudo apt-get install -y libvulkan-dev
      - name: Build core
        run: make -C core
      - name: Core tests (correctness + timing)
        run: python3 tests/test_core.py
      - name: Package
        run: make -C core package
